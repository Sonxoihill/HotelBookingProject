server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: hotel-booking-backend

  datasource:
    url: jdbc:mysql://localhost:3308/hotel_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.hotel.booking: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
